<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - Lib-Man</title>

  <style>
    /* Arka Plan - Mint Theme */
    body {
        background: linear-gradient(135deg, #b2f7ef 0%, #5ccccc 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Inter', sans-serif;
        margin: 0;
    }

    /* Login Card */
    .login-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 25px rgba(0, 100, 100, 0.15);
        text-align: center;
        border: 1px solid #c8e7e7;
    }

    .login-card h1 {
        color: #0f7f7f;
        margin-bottom: 25px;
        font-size: 26px;
        font-weight: 700;
    }

    /* Forms */
    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    .form-group label {
        color: #006969;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 14px;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 2px solid #c8e7e7;
        background: #eafffa;
        transition: .25s;
        font-size: 14px;
        color: #004a4a;
    }

    .form-group input:focus {
        border-color: #14b8b8;
        box-shadow: 0 0 0 3px rgba(20,184,184,0.20);
        outline: none;
    }

    /* Login Button */
    .btn-login {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #14b8b8 0%, #0f7f7f 100%);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: .25s;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(0,150,150,0.25);
    }

    /* Error / Success */
    .error-msg {
        padding: 12px;
        text-align: center;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 20px;
        font-weight: 600;
    }

    /* Register Link */
    .register-link {
        margin-top: 20px;
        font-size: 14px;
        color: #005a5a;
    }

    .register-link a {
        color: #0f7f7f;
        font-weight: 700;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="login-card">
  <h1>📚 Lib-Man Girişi</h1>

  <div th:if="${param.error}" class="error-msg" style="background:#ffefef; color:#c62828;">
    ❌ Kullanıcı adı veya şifre hatalı!
  </div>

  <div th:if="${param.logout}" class="error-msg" style="background:#eaffe6; color:#2e7d32;">
    ✅ Başarıyla çıkış yapıldı.
  </div>

  <div th:if="${successMessage}" class="error-msg" style="background:#eaffe6; color:#2e7d32;">
    <span th:text="${successMessage}"></span>
  </div>

  <form th:action="@{/login}" method="post">

    <div class="form-group">
      <label>Kullanıcı Adı</label>
      <input type="text" id="username" name="username" placeholder="Örn: ahmet" required>
    </div>

    <div class="form-group">
      <label>Şifre</label>
      <input type="password" id="password" name="password" placeholder="******" required>
    </div>

    <button class="btn-login">Giriş Yap</button>
  </form>

  <div class="register-link">
    Hesabınız yok mu? <a th:href="@{/register}">Kayıt Ol</a>
  </div>
</div>

</body>
</html>
