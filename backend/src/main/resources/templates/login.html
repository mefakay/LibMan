<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | Lib-Man</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-container">

  <div class="auth-left">
    <div class="brand-icon">
      <i class="fas fa-book-reader"></i>
    </div>
    <h2>Kütüphaneye Hoşgeldin</h2>
    <p>
      Binlerce kitaba erişmek, ödünç işlemlerini yönetmek ve
      kütüphane dünyasını keşfetmek için giriş yapın.
    </p>
  </div>

  <div class="auth-right">

    <div class="auth-header">
      <h1 class="auth-title">Tekrar Merhaba! 👋</h1>
      <p class="auth-subtitle">Hesabınıza giriş yapmak için bilgilerinizi girin.</p>
    </div>

    <div th:if="${param.error}" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <span>Kullanıcı adı veya şifre hatalı!</span>
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      <span>Başarıyla çıkış yapıldı.</span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
    </div>

    <form th:action="@{/login}" method="post">

      <div class="form-group">
        <label class="form-label">Kullanıcı Adı</label>
        <div style="position: relative;">
          <input type="text" name="username" class="form-control" placeholder="Örn: ahmet123" required>
          <i class="fas fa-user" style="position: absolute; right: 15px; top: 15px; color: #ccc;"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Şifre</label>
        <div style="position: relative;">
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          <i class="fas fa-lock" style="position: absolute; right: 15px; top: 15px; color: #ccc;"></i>
        </div>
      </div>

      <button type="submit" class="btn-auth">Giriş Yap <i class="fas fa-arrow-right" style="margin-left: 5px;"></i></button>

    </form>

    <div class="auth-footer">
      Hesabınız yok mu? <a th:href="@{/register}">Hemen Kayıt Ol</a>
    </div>
  </div>

</div>

</body>
</html>
