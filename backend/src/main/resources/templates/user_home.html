<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>👤 Kullanıcı Paneli</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/user.css" />
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👤 Kullanıcı Paneli</h1>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button type="submit" class="danger">🚪 Çıkış Yap</button>
        </form>
    </div>

    <div class="user-select-section">
        <h2>👤 Hoş Geldiniz, <span th:text="${username}">Kullanıcı</span></h2>

        <div class="user-select-grid">
            <div class="form-group">
                <label>Kullanıcı Adınız (Sistem Tarafından Otomatik Seçildi)</label>
                <input type="text" id="selectedUsername" th:value="${username}" readonly style="background-color: #e3f2fd;" />
            </div>
            <button onclick="loadUserData()">Verilerimi Getir</button>
        </div>

        <div id="currentUserInfo" class="current-user" style="display: none;">
            <strong>Aktif Kullanıcı:</strong> <span id="currentUsername"></span>
        </div>
    </div>

    <div class="section">
        <h2>📖 Kitap Ödünç Al</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Kitap ID *</label>
                <input type="number" id="borrowBookId" placeholder="Ödünç alınacak kitap ID" />
            </div>
        </div>
        <button class="success" onclick="borrowBook()">📖 Kitap Ödünç Al</button>
    </div>

    <div class="section">
        <h2>↩️ Kitap İade Et</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Kitap ID *</label>
                <input type="number" id="returnBookId" placeholder="İade edilecek kitap ID" />
            </div>
        </div>
        <button class="success" onclick="returnBook()">↩️ Kitap İade Et</button>
    </div>

    <div class="section">
        <h2>📚 Ödünç Kayıtlarım</h2>
        <button onclick="getUserBorrows()" class="info">🔄 Yenile</button>
        <div id="borrowsTable" class="table-container"></div>
    </div>

    <div class="section">
        <h2>📚 Tüm Kitaplar</h2>
        <button onclick="getAllBooks()" class="info">🔄 Yenile</button>
        <div id="booksTable" class="table-container"></div>
    </div>

    <div id="alert" class="alert"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/user.js"></script>

<script>
    window.onload = function() {
        getAllBooks();
        // Sayfa yüklenince otomatik olarak verileri çekmeye çalış
        // (1 saniye gecikmeli ki HTML tam otursun)
        setTimeout(loadUserData, 500);
    };
</script>
</body>
</html>
