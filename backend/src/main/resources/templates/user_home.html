<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>👤 Kullanıcı Paneli | Lib-Man</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* ============================================
           USER SAYFASI – SU YEŞİLİ MODERN TEMA
        ============================================ */

        /* ARKA PLAN: Açık su yeşili degrade */
        body {
            background: linear-gradient(135deg, #b2f7ef 0%, #5ccccc 100%);
            padding: 20px;
            font-family: 'Inter', sans-serif;
            color: #003333;
        }

        .container {
            background: none !important;
        }

        /* NAVBAR */
        .navbar {
            background-color: #0f7f7f !important;
            border-bottom: 3px solid #1daaaa;
        }

        .navbar-brand {
            color: #d9fffa !important;
            font-weight: bold;
        }

        .nav-link {
            color: #e6fffb !important;
        }
        .nav-link:hover {
            color: #ffffff !important;
        }
        .nav-link.active {
            color: #ffffff !important;
            border-bottom: 2px solid #b2f7ef;
        }

        /* SEARCH INPUT */
        .form-control {
            background-color: #eafffa !important;
            color: #004949 !important;
            border: 1px solid #1daaaa;
        }
        .form-control:focus {
            border-color: #0c7f7f;
            box-shadow: 0 0 0 0.25rem rgba(0,150,150,0.15);
        }

        /* BUTTONLAR */
        .btn-primary {
            background: linear-gradient(135deg, #1daaaa 0%, #0c7f7f 100%);
            border-color: #1daaaa;
            color: white !important;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(0, 100, 100, 0.35);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #1daaaa;
            border-color: #1daaaa;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #0c7f7f;
        }

        .btn-success {
            background-color: #2ecc71;
            border-color: #2ecc71;
        }

        .btn-warning {
            background-color: #f1c40f;
            border-color: #f1c40f;
            color: #003333 !important;
        }

        .btn-danger {
            background-color: #e74c3c;
            border-color: #e74c3c;
        }

        /* KARTLAR */
        .card {
            background-color: #e6fffb;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #9fffea;
            box-shadow: 0 4px 12px rgba(0, 70, 70, 0.12);
        }

        .card-header {
            background-color: #1daaaa !important;
            color: white;
            border-bottom: 1px solid #128888;
            font-weight: bold;
        }

        .card-title {
            color: #0e5f5f;
        }

        /* TABLE */
        .table-container {
            color: #003f3f;
        }

        thead {
            background: linear-gradient(135deg, #1daaaa 0%, #0c7f7f 100%);
            color: white;
        }

        /* Kullanıcı bilgisi kutusu */
        .current-user {
            background: #d5fffa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #1daaaa;
        }

        .current-user strong {
            color: #0c7f7f;
        }

        /* Input & Select */
        input, select {
            border: 2px solid #1daaaa !important;
            background: white !important;
            color: #005050 !important;
        }

        input:focus, select:focus {
            border-color: #0c7f7f !important;
            box-shadow: 0 0 0 3px rgba(0,150,150,0.15) !important;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-lg">
    <div class="container-fluid container">
        <a class="navbar-brand fw-bold">
            <i class="fas fa-book-reader me-2"></i> Lib-Man
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <div class="d-flex mx-auto w-50 my-2 my-lg-0">
                <input class="form-control me-2" type="search" placeholder="Kitap ara..." id="navSearchInput">
                <button class="btn btn-primary" onclick="searchBooks(document.getElementById('navSearchInput').value)">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fas fa-home me-1"></i> Anasayfa</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#booksTable"><i class="fas fa-list me-1"></i> Kataloğum</a>
                </li>

                <li class="nav-item dropdown ms-lg-3">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle me-1"></i> <span th:text="${username}">Kullanıcı</span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item"><i class="fas fa-id-card me-1"></i> Profilim</a></li>
                        <li><a class="dropdown-item"><i class="fas fa-cog me-1"></i> Ayarlar</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button class="dropdown-item text-danger">
                                    <i class="fas fa-sign-out-alt me-1"></i> Çıkış Yap
                                </button>
                            </form>
                        </li>
                    </ul>

                </li>
            </ul>

        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- === Hoş geldiniz kartı === -->
    <div class="card shadow-lg mb-4">
        <div class="card-body p-4">
            <h4 class="card-title mb-3">
                <i class="fas fa-hand-peace me-2" style="color:#f1c40f;"></i>
                Hoş Geldiniz, <span th:text="${username}" class="fw-bold" style="color:#0f7f7f;">Kullanıcı</span>
            </h4>

            <div class="row align-items-center">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Kullanıcı Adınız:</label>
                    <input id="selectedUsername" th:value="${username}" readonly class="form-control border-0">
                </div>

                <div class="col-md-3 d-flex">
                    <button onclick="loadUserData()" class="btn btn-primary btn-sm shadow-sm w-100 mt-3">
                        Verilerimi Getir
                    </button>
                </div>

            </div>

            <div id="currentUserInfo" class="current-user" style="display:none;">
                <strong><i class="fas fa-check-circle me-1"></i> Aktif Kullanıcı:</strong>
                <span id="currentUsername"></span>
            </div>

        </div>
    </div>

    <!-- === Borrow + Return işlemleri === -->
    <div class="row g-4 mb-4">

        <!-- Ödünç isteği -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">
                        <i class="fas fa-paper-plane me-2" style="color:#1daaaa;"></i> Kitap Ödünç İsteği Gönder
                    </h5>

                    <label class="form-label">Kitap ID *</label>
                    <input id="requestBookId" type="number" class="form-control">

                    <button onclick="sendBorrowRequest()" class="btn btn-success w-100 mt-3">
                        <i class="fas fa-check me-1"></i> Gönder
                    </button>
                </div>
            </div>
        </div>

        <!-- İade -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">
                        <i class="fas fa-undo me-2" style="color:#f1c40f;"></i> Kitap İade Et
                    </h5>

                    <label class="form-label">Ödünç ID *</label>
                    <input id="returnBookId" type="number" class="form-control">

                    <button onclick="returnBook()" class="btn btn-warning w-100 mt-3">
                        <i class="fas fa-reply me-1"></i> İade Et
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- === Kullanıcının istekleri & ödünç kayıtları === -->
    <div class="row g-4">

        <!-- İsteklerim -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header">📩 Ödünç İsteklerim</div>
                <div class="card-body">
                    <button onclick="getMyBorrowRequests()" class="btn btn-secondary btn-sm mb-2">Yenile</button>
                    <div id="requestsTable" class="table-container"></div>
                </div>
            </div>
        </div>

        <!-- Ödünç kayıtlarım -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header">📘 Ödünç Kayıtlarım</div>
                <div class="card-body">
                    <button onclick="getUserBorrows()" class="btn btn-secondary btn-sm mb-2">Yenile</button>
                    <div id="borrowsTable" class="table-container"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- === Katalog === -->
    <div class="card shadow-lg mt-4 mb-5">
        <div class="card-header">
            <h5 class="mb-0" style="color:#0f7f7f;">
                <i class="fas fa-search me-2"></i> KÜTÜPHANE KATALOĞU
            </h5>
        </div>

        <div class="card-body">

            <button onclick="getAllBooks()" class="btn btn-secondary mb-3">📚 Tümünü Göster</button>

            <div id="booksTable" class="row g-3"></div>

        </div>
    </div>

    <div id="alert" class="alert fixed-bottom m-3"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/user.js"></script>

<script>
    window.onload = function () {
        getAllBooks();
        setTimeout(() => {
            loadUserData();
            getMyBorrowRequests();
        }, 500);

        const searchInput = document.getElementById("navSearchInput");

        if (searchInput) {
            searchInput.addEventListener("keypress", function (e) {
                if (e.key === "Enter") {
                    searchBooks(searchInput.value);
                }
            });
        }
    };
</script>

</body>
</html>
