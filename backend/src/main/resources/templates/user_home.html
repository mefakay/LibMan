<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lib-Man Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/user.css">
</head>
<body>

<aside class="sidebar">
    <div class="brand-logo">
        <i class="fas fa-book-reader"></i> Lib-Man
    </div>

    <div class="user-box">
        <img src="https://ui-avatars.com/api/?name=User&background=00b894&color=fff" class="user-avatar" alt="User">
        <div style="line-height: 1.2;">
            <div style="font-weight: 600; font-size: 14px;" th:text="${username}">Kullanıcı</div>
            <div style="font-size: 11px; color: #888;">Öğrenci</div>
        </div>
    </div>

    <ul class="nav-menu">
        <li>
            <a href="#" class="active" onclick="showSection('catalog')">
                <i class="fas fa-th-large"></i> Ana Panel
            </a>
        </li>
        <li>
            <a href="#" onclick="showSection('mybooks')">
                <i class="fas fa-book"></i> Kitaplarım
            </a>
        </li>
        <li>
            <a href="#" onclick="showSection('requests')">
                <i class="fas fa-clock"></i> İstekler
            </a>
        </li>
        <li style="margin-top: 30px;">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-link text-decoration-none text-danger ps-3">
                    <i class="fas fa-sign-out-alt me-2"></i> Çıkış Yap
                </button>
            </form>
        </li>
    </ul>
</aside>

<main class="main-content">

    <div class="header-section">
        <div>
            <h2 style="font-weight: 700; margin-bottom: 5px;">Hoşgeldin! 👋</h2>
            <p class="text-muted">Bugün kütüphanede neler keşfetmek istersin?</p>
        </div>
        <div class="search-wrapper">
            <i class="fas fa-search text-muted"></i>
            <input type="text" id="searchInput" placeholder="Kitap ara...">
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon-bg bg-teal"><i class="fas fa-swatchbook"></i></div>
            <div class="stat-number" id="totalBooksCount">0</div>
            <div class="stat-label">Toplam Kitap</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon-bg bg-orange"><i class="fas fa-book-reader"></i></div>
            <div class="stat-number" id="activeBorrowsCount">0</div>
            <div class="stat-label">Okuduklarım</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon-bg bg-blue"><i class="fas fa-hourglass-half"></i></div>
            <div class="stat-number" id="pendingRequestsCount">0</div>
            <div class="stat-label">Bekleyen İstek</div>
        </div>
    </div>

    <div class="content-grid">

        <div class="content-card">
            <div class="card-header-flex">
                <h4 style="font-weight: 600;">📚 Kitap Kataloğu</h4>
                <button class="btn btn-sm btn-light" onclick="loadBooks()">Yenile</button>
            </div>

            <div id="bookListContainer">
                <div class="text-center py-4"><div class="spinner-border text-success"></div></div>
            </div>
        </div>

        <div class="content-card">
            <div class="card-header-flex">
                <h5 style="font-weight: 600;">Hızlı İşlemler</h5>
            </div>

            <div class="p-3 bg-light rounded mb-3">
                <h6 class="mb-2" style="font-size: 13px; font-weight: 600;">İade Et</h6>
                <div class="input-group">
                    <input type="number" id="returnIdInput" class="form-control form-control-sm border-0" placeholder="Ödünç ID">
                    <button class="btn btn-success btn-sm" onclick="returnBook()"><i class="fas fa-check"></i></button>
                </div>
            </div>

            <h6 style="font-size: 13px; font-weight: 600; margin-top: 20px;">Son Hareketler</h6>
            <div id="recentActivity" class="mt-3">
                <small class="text-muted d-block text-center">Henüz işlem yok.</small>
            </div>
        </div>

    </div>

</main>

<input type="hidden" id="currentUsername" th:value="${username}">

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="toastTitle">Lib-Man</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastMessage">...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/user.js"></script>
</body>
</html>
