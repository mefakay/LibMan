<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | Lib-Man</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-left" style="background: linear-gradient(135deg, #0984e3 0%, #6c5ce7 100%);">
        <div class="brand-icon">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2>Aramıza Katıl</h2>
        <p>
            Ücretsiz hesap oluşturarak kütüphane kataloğuna erişin,
            kitap ayırtın ve okuma geçmişinizi takip edin.
        </p>
    </div>

    <div class="auth-right">

        <div class="auth-header">
            <h1 class="auth-title">Hesap Oluştur 🚀</h1>
            <p class="auth-subtitle">Sadece birkaç saniye sürer.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/api/auth/register}" method="post">

            <div class="form-group">
                <label class="form-label">Ad Soyad</label>
                <input type="text" name="fullName" class="form-control" placeholder="Adınız Soyadınız" required>
            </div>

            <div class="form-group">
                <label class="form-label">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" placeholder="Kullanıcı adı seçin" required>
            </div>

            <div class="form-group">
                <label class="form-label">E-posta</label>
                <input type="email" name="email" class="form-control" placeholder="ornek@mail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="Güçlü bir şifre girin" required>
            </div>

            <input type="hidden" name="role" value="USER">

            <button type="submit" class="btn-auth">Kayıt Ol</button>

        </form>

        <div class="auth-footer">
            Zaten hesabınız var mı? <a th:href="@{/login}">Giriş Yap</a>
        </div>
    </div>

</div>

</body>
</html>
