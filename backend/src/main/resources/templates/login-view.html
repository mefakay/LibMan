<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - Kütüphane Sistemi</title>
  <style>
    body {
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
    }
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    .login-card h1 {
        color: #2c3e50;
        margin-bottom: 30px;
        font-size: 24px;
    }
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #666;
        font-size: 14px;
    }
    .form-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #eee;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
        transition: all 0.3s;
    }
    .form-group input:focus {
        border-color: #3498db;
        outline: none;
    }
    .btn-login {
        background: #3498db;
        color: white;
        border: none;
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s;
    }
    .btn-login:hover {
        background: #2980b9;
    }
    .error-msg {
        background-color: #ffebee;
        color: #c62828;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 14px;
    }
    .register-link {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
    }
    .register-link a {
        color: #3498db;
        text-decoration: none;
        font-weight: 600;
    }
  </style>
</head>
<body>

<div class="login-card">
  <h1>📚 Kütüphane Girişi</h1>

  <div th:if="${param.error}" class="error-msg">
    ❌ Kullanıcı adı veya şifre hatalı!
  </div>

  <div th:if="${param.logout}" class="error-msg" style="background-color: #e8f5e9; color: #2e7d32;">
    ✅ Başarıyla çıkış yapıldı.
  </div>

  <div th:if="${successMessage}" class="error-msg" style="background-color: #e8f5e9; color: #2e7d32;">
    <span th:text="${successMessage}"></span>
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" name="username" placeholder="Örn: ahmet" required>
    </div>

    <div class="form-group">
      <label for="password">Şifre</label>
      <input type="password" id="password" name="password" placeholder="******" required>
    </div>

    <button type="submit" class="btn-login">Giriş Yap</button>
  </form>

  <div class="register-link">
    Hesabınız yok mu? <a th:href="@{/register}">Hemen Kayıt Ol</a>
  </div>
</div>

</body>
</html>
