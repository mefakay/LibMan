<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Anasayfa</title>
</head>
<body>
<div style="width: 80%; margin: 50px auto;">
  <h1>Hoş Geldiniz!</h1>

  <p>Oturum Açan Kullanıcı: <span sec:authentication="name"></span></p>
  <p>Kullanıcı Rolü: <span sec:authentication="authorities"></span></p>

  <form th:action="@{/logout}" method="post">
    <button type="submit">Çıkış Yap</button>
  </form>

  <hr>

  <h2>Kütüphane İşlemleri</h2>

  <div sec:authorize="hasRole('ADMIN')">
    <h3>Yönetici Paneli</h3>
    <p>Admin yetkileriyle erişilebilen içerik.</p>
  </div>

  <div sec:authorize="hasAnyRole('USER', 'ADMIN')">
    <h3>Kullanıcı İşlemleri</h3>
    <p>Kitapları ödünç alabilir veya iade edebilirsiniz.</p>
  </div>

</div>
</body>
</html>
