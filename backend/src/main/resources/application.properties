# Server Port
server.port=8080

# Application Name
spring.application.name=Library Management System

# ============================================
# MYSQL DATABASE CONFIGURATION
# ============================================
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/library_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Ahmet03Zapod
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration (MySQL için)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
