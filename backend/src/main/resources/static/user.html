<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 Kullanıcı Paneli</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Kullanıcı Paneli</h1>
            <a href="index.html" class="back-btn">← Ana Sayfa</a>
        </div>
        
        <!-- KULLANICI SEÇİMİ -->
        <div class="user-select-section">
            <h2>👤 Kullanıcı Seçimi</h2>
            <div class="user-select-grid">
                <div class="form-group">
                    <label>Kullanıcı Adı (Username)</label>
                    <input type="text" id="selectedUsername" placeholder="Örn: ahmet" value="ahmet">
                </div>
                <button onclick="loadUserData()">Yükle</button>
            </div>
            <div id="currentUserInfo" class="current-user" style="display: none;">
                <strong>Seçili Kullanıcı:</strong> <span id="currentUsername"></span>
            </div>
        </div>
        
        <!-- KİTAP ÖDÜNÇ ALMA -->
        <div class="section">
            <h2>📖 Kitap Ödünç Al</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Kitap ID *</label>
                    <input type="number" id="borrowBookId" placeholder="Ödünç alınacak kitap ID">
                </div>
            </div>
            <button class="success" onclick="borrowBook()">📖 Kitap Ödünç Al</button>
            <p style="margin-top: 10px; color: #666; font-size: 0.9em;">💡 Önce yukarıdan kullanıcı adını seçin ve "Yükle" butonuna tıklayın.</p>
        </div>
        
        <!-- KİTAP İADE ETME -->
        <div class="section">
            <h2>↩️ Kitap İade Et</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Kitap ID *</label>
                    <input type="number" id="returnBookId" placeholder="İade edilecek kitap ID">
                </div>
            </div>
            <button class="success" onclick="returnBook()">↩️ Kitap İade Et</button>
            <p style="margin-top: 10px; color: #666; font-size: 0.9em;">💡 Önce yukarıdan kullanıcı adını seçin ve "Yükle" butonuna tıklayın.</p>
        </div>
        
        <!-- ÖDÜNÇ KAYITLARI -->
        <div class="section">
            <h2>📚 Ödünç Kayıtlarım</h2>
            <button onclick="getUserBorrows()" class="info">🔄 Yenile</button>
            <div id="borrowsTable" class="table-container"></div>
        </div>
        
        <!-- KİTAP ARAMA -->
        <div class="section">
            <h2>🔍 Kitap Ara</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Kitap Adı</label>
                    <input type="text" id="searchInput" placeholder="Örn: Suç, Savaş, 1984...">
                </div>
            </div>
            <button onclick="searchBooks()" class="info">🔍 Ara</button>
            <button onclick="showAllBooks()" class="info">🔄 Tümünü Göster</button>
            <div id="searchResults" class="table-container" style="margin-top: 20px;"></div>
        </div>
        
        <div id="alert" class="alert"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/user.js"></script>
</body>
</html>
