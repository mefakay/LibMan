<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍💼 Yönetici Paneli</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍💼 Yönetici Paneli</h1>
            <a href="index.html" class="back-btn">← Ana Sayfa</a>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('books')">📚 Kitap Yönetimi</button>
            <button class="tab" onclick="switchTab('users')">👥 Kullanıcı Yönetimi</button>
            <button class="tab" onclick="switchTab('borrows')">📖 Ödünç Kayıtları</button>
        </div>
        
        <!-- KİTAP YÖNETİMİ -->
        <div id="books" class="tab-content active">
            <div class="section">
                <h2>➕ Yeni Kitap Ekle</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Kitap Başlığı *</label>
                        <input type="text" id="bookTitle" placeholder="Örn: Suç ve Ceza">
                    </div>
                    <div class="form-group">
                        <label>Yazar *</label>
                        <input type="text" id="bookAuthor" placeholder="Örn: Fyodor Dostoyevski">
                    </div>
                    <div class="form-group">
                        <label>ISBN *</label>
                        <input type="text" id="bookIsbn" placeholder="Örn: 978-975-08-1234-5">
                    </div>
                    <div class="form-group">
                        <label>Yayın Yılı</label>
                        <input type="number" id="bookYear" placeholder="Örn: 1866">
                    </div>
                    <div class="form-group">
                        <label>Toplam Kopya *</label>
                        <input type="number" id="bookTotal" placeholder="Örn: 5" value="5">
                    </div>
                </div>
                <button onclick="addBook()">➕ Kitap Ekle</button>
                <button onclick="getAllBooks()" class="success">🔄 Listeyi Yenile</button>
            </div>
            
            <div class="section">
                <h2>✏️ Kitap Güncelle</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Kitap ID *</label>
                        <input type="number" id="updateBookId" placeholder="Güncellenecek kitap ID">
                    </div>
                    <div class="form-group">
                        <label>Yeni Başlık *</label>
                        <input type="text" id="updateTitle" placeholder="Yeni başlık">
                    </div>
                    <div class="form-group">
                        <label>Yeni Yazar *</label>
                        <input type="text" id="updateAuthor" placeholder="Yeni yazar">
                    </div>
                    <div class="form-group">
                        <label>Yeni ISBN *</label>
                        <input type="text" id="updateIsbn" placeholder="Yeni ISBN">
                    </div>
                    <div class="form-group">
                        <label>Yayın Yılı</label>
                        <input type="number" id="updateYear" placeholder="Yayın yılı">
                    </div>
                    <div class="form-group">
                        <label>Toplam Kopya *</label>
                        <input type="number" id="updateTotal" placeholder="Toplam kopya">
                    </div>
                    <div class="form-group">
                        <label>Mevcut Kopya</label>
                        <input type="number" id="updateAvailable" placeholder="Mevcut kopya">
                    </div>
                </div>
                <button onclick="updateBook()">✏️ Kitap Güncelle</button>
            </div>
            
            <div class="section">
                <h2>🗑️ Kitap Sil</h2>
                <div class="form-group" style="max-width: 300px;">
                    <label>Kitap ID</label>
                    <input type="number" id="deleteBookId" placeholder="Silinecek kitap ID">
                </div>
                <button class="danger" onclick="deleteBook()">🗑️ Kitap Sil</button>
            </div>
            
            <div class="section">
                <h2>📋 Tüm Kitaplar</h2>
                <button onclick="getAllBooks()" class="success">🔄 Yenile</button>
                <div id="booksTable" class="table-container"></div>
            </div>
        </div>
        
        <!-- KULLANICI YÖNETİMİ -->
        <div id="users" class="tab-content">
            <div class="section">
                <h2>👥 Tüm Kullanıcılar</h2>
                <button onclick="getAllUsers()" class="success">🔄 Yenile</button>
                <div id="usersTable" class="table-container"></div>
            </div>
        </div>
        
        <!-- ÖDÜNÇ KAYITLARI -->
        <div id="borrows" class="tab-content">
            <div class="section">
                <h2>📖 Tüm Ödünç Kayıtları</h2>
                <button onclick="getAllBorrows()" class="success">🔄 Yenile</button>
                <div id="borrowsTable" class="table-container"></div>
            </div>
        </div>
        
        <div id="alert" class="alert"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
